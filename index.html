const LVT=["Novato","Aprendiz","Jugón","Veterano","Experto","Maestro","Leyenda"];
function subLv(){const g={},p={};
 const add=(o,k,h,d)=>{if(!k)return;const x=o[k]||(o[k]={h:0,d:0});x.h+=h;x.d+=d};
 S.sessions.forEach(x=>{const gm_=G(x.gameId);if(!gm_||gm_.status==="wish")return;const h=x.min/60;(gm_.genre||"").split(",").map(z=>z.trim()).filter(Boolean).forEach(k=>add(g,k,h,0));add(p,x.platform||gm_.platform,h,0)});
 S.games.filter(q=>isDone(q)).forEach(q=>{const n=Math.max(1,comps(q).length);(q.genre||"").split(",").map(z=>z.trim()).filter(Boolean).forEach(k=>add(g,k,0,n));add(p,q.platform,0,n)});
 const f=o=>Object.entries(o).map(([k,v])=>{const pts=v.h+3*v.d,lv=Math.floor(Math.sqrt(pts/2))+1;return{k,h:v.h,d:v.d,pts,lv,lo:2*(lv-1)**2,hi:2*lv*lv,t:LVT[Math.min(LVT.length-1,Math.floor((lv-1)/2))]}}).sort((a,b)=>b.pts-a.pts);
 return{g:f(g),p:f(p)}}
function lvRows(a){return a.length?a.map(x=>`<div class="lvr"><div class="lvb">Nv ${x.lv}</div><div style="flex:1;min-width:0"><div class="row sp"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(x.k)}</b><span class="mu">${x.t}</span></div>${bar(x.pts-x.lo,x.hi-x.lo)}<div class="mu" style="font-size:11px">${H(x.h*60)} · ${x.d} completado${x.d===1?"":"s"} · ${Math.ceil(x.hi-x.pts)} pts para Nv ${x.lv+1}</div></div></div>`).join(""):`<div class="empty">Aún no hay datos. Registra sesiones y se irán subiendo los niveles.</div>`}
function levelsCard(){const L=subLv(),top=[...L.g.slice(0,2),...L.p.slice(0,1)];
 return`<div class="card" style="cursor:pointer;margin-top:12px" onclick="levelsSheet()"><div class="row sp"><b>🏅 Niveles por género y plataforma</b><span class="mu">ver todos ›</span></div>${top.length?`<div style="margin-top:8px">${top.map(x=>`<span class="chip">${e(x.k)} · Nv ${x.lv}</span>`).join("")}</div>`:`<div class="mu" style="margin-top:6px">Juega para subir de nivel en cada género y plataforma.</div>`}</div>`}

function season(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),i=(m===11||m<2)?0:m<5?1:m<8?2:3,sy=i===0&&m<2?y-1:y,sm=[11,2,5,8][i],a=new Date(sy,sm,1),b=new Date(sy,sm+3,0),
 nm=["Invierno","Primavera","Verano","Otoño"][i],em=["❄️","🌸","☀️","🍂"][i];
 return{key:nm+" "+(i===0?sy+1:sy),nm,em,a:ymd(a),b:ymd(b),left:Math.max(0,Math.ceil((b-n)/864e5))}}
function challenges(){const se=season(),ss=S.sessions.filter(x=>!x.ap&&x.date>=se.a&&x.date<=se.b&&G(x.gameId)&&G(x.gameId).status!=="wish"),
 gen=new Set(),pl=new Set(),dm={};ss.forEach(x=>{const g=G(x.gameId);(g.genre||"").split(",").map(z=>z.trim()).filter(Boolean).forEach(z=>gen.add(z));if(x.platform||g.platform)pl.add(x.platform||g.platform);dm[x.date]=1});
 const days=Object.keys(dm).sort();let run=0,rec=0,pv=null;days.forEach(d=>{const t=new Date(d+"T12:00");run=pv&&Math.round((t-pv)/864e5)===1?run+1:1;pv=t;rec=Math.max(rec,run)});
 const inr=d=>d&&d>=se.a&&d<=se.b,done=S.games.reduce((n,g)=>n+comps(g).filter(inr).length,0),goals=S.games.reduce((n,g)=>n+(g.goals||[]).filter(x=>x.done&&inr(x.at)).length,0),
 hrs=Math.round(ss.reduce((a,x)=>a+x.min,0)/6)/10;
 const list=[{i:"🏁",n:"Completa 2 juegos",v:done,t:2},{i:"⏱",n:"Juega 30 horas",v:hrs,t:30},{i:"🎨",n:"Prueba 3 géneros distintos",v:gen.size,t:3},{i:"🎮",n:"Juega en 2 plataformas",v:pl.size,t:2},{i:"🎖️",n:"Consigue 5 logros",v:goals,t:5},{i:"🔥",n:"Racha de 5 días seguidos",v:rec,t:5},{i:"📅",n:"Juega en 20 días distintos",v:days.length,t:20}];

 if(!o||o.done!==nd||o.total!==list.length){S.seasons[se.key]={nm:se.nm,em:se.em,done:nd,total:list.length};save()}
 return{se,list,nd}}
function seasonCard(){const c=challenges();return`<div class="card sea" style="cursor:pointer" onclick="seasonSheet()"><div class="row sp"><b>${c.se.em} Desafíos de ${c.se.nm}</b><span class="mu">${c.nd}/${c.list.length} · quedan ${c.se.left} d ›</span></div>${bar(c.nd,c.list.length)}</div>`}

 ${c.list.map(m=>`<div class="card"><div class="row sp"><span>${m.i} ${m.n}</span><span class="mu">${Math.min(m.v,m.t)}/${m.t}${m.v>=m.t?" ✅":""}</span></div>${bar(m.v,m.t)}</div>`).join("")}
 ${c.nd===c.list.length?`<div class="card" style="text-align:center"><div style="font-size:44px">🏆</div><b>¡Trofeo de ${e(c.se.key)} conseguido!</b></div>`:""}

const ENm=new Map(),ENx=[];
for(const[k,v]of Object.entries(EN_DICT)){if(k.includes("{}")){ENx.push([new RegExp("^"+k.split("{}").map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("([\\s\\S]+?)")+"$"),v,k.replace(/\{\}/g,"").length])}else ENm.set(k,v)}
ENx.sort((a,b)=>b[2]-a[2]);
function tr(s){if(LANG!=="en"||!s)return s;s=String(s);const t=s.trim();if(!t)return s;let r=ENm.get(t);
 if(r===undefined){for(const[re,v]of ENx){const m=t.match(re);if(m){let i=0;r=v.replace(/\{\}/g,()=>tr(m[++i]));break}}}
 if(r===undefined){if(window._miss&&/[a-záéíóúñ¿¡]{3}/i.test(t))window._miss.add(t);return s}
 return s.replace(t,()=>r)}

 const walk=n=>{if(n.nodeType===3){if(n._t===n.nodeValue)return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;n._t=n.nodeValue}else if(n.nodeType===1){if(n.tagName==="SCRIPT"||n.tagName==="STYLE")return;
  ["placeholder","title","aria-label"].forEach(a=>{if(n.hasAttribute&&n.hasAttribute(a)){const v=tr(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}});
  if(n.tagName==="OPTION"||(n.tagName==="INPUT"&&(n.type==="button"||n.type==="submit"))){}
  n.childNodes.forEach(walk)}};
 new MutationObserver(ms=>{ms.forEach(m=>{if(m.type==="characterData")walk(m.target);else m.addedNodes.forEach(walk)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
 document.title=tr(document.title);walk(document.body)}

 while(n&&n.nodeType===1&&n!==document.body){for(const a of["onclick","onchange","onpointerdown","onsubmit","onkeydown"]){const v=n.getAttribute&&n.getAttribute(a);if(v&&GUEST_BLOCK.test(v)){ev.preventDefault();ev.stopImmediatePropagation();if(ev.type!=="pointerdown"&&ev.type!=="keydown"||ev.key==="Enter")needAcct();return}}n=n.parentNode}}
