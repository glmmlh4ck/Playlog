<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10"><meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Playlog"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><title>Playlog</title>
<style>
:root{--bg:#0b0b10;--s1:#15151d;--s2:#1e1e29;--bd:rgba(255,255,255,.07);--tx:#f4f4f8;--mu:#9494a8;--ac:#8b5cf6;--ac2:#b69dff;--ok:#34d399;--er:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(120% 45% at 50% -8%,#2d1b5e 0%,transparent 62%)}
#main{flex:1;overflow-y:auto;padding:18px 16px 28px}
h1{font-size:26px;font-weight:700;margin:0 0 2px;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:600;margin:24px 0 10px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 6px 20px #0006}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#c4b5fd);box-shadow:0 0 12px #8b5cf699}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:46px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #8b5cf63d}
button{cursor:pointer;width:auto;font-weight:500;transition:transform .12s,background .2s}button:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0;font-weight:600;box-shadow:0 4px 14px #7c3aed66}.dng{color:var(--er)}
textarea{min-height:76px}label{display:block;margin:12px 0 5px;color:var(--mu);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.tabs button{width:100%;white-space:nowrap;min-height:40px;padding:6px 0;font-size:12px;text-align:center;border-radius:99px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--mu)}.pie{width:110px;height:110px;border-radius:50%;flex:none;position:relative}.pie:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--s1)}
.tabs .on{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0;box-shadow:0 3px 12px #7c3aed66}
nav{display:flex;align-items:center;justify-content:space-around;background:rgba(21,21,29,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);min-width:60px;padding:4px;position:relative}
nav button.on{color:var(--ac2)}nav button.on:after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--ac2);box-shadow:0 0 8px var(--ac)}
nav .plus{background:linear-gradient(135deg,#7c3aed,#a47bff);color:#fff;border-radius:50%;width:58px;height:58px;margin-top:-28px;font-size:32px;font-weight:300;justify-content:center;box-shadow:0 0 0 6px var(--bg),0 8px 22px #7c3aedaa}
.hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:22px;margin:14px 0 4px;background:linear-gradient(135deg,#2e1a69,#171727);border:1px solid #8b5cf655;box-shadow:0 10px 30px #5b2fd144}
.ring{width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--ac2) calc(var(--p)*1%),#ffffff1c 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#1b1536}.ring>*{position:relative}.ring b{font-size:28px;line-height:1}.ring small{font-size:9px;letter-spacing:.14em;color:var(--mu)}
.chip{display:inline-block;background:#ffffff14;border-radius:99px;padding:3px 11px;font-size:12px;margin:8px 6px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
#main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}button{touch-action:manipulation}
input,select,textarea{font-size:16px}h1{font-size:24px}.tabs button{min-height:42px}nav button{min-height:48px;min-width:64px}
@media(min-width:600px){body{background:#050508;display:grid;place-items:center}#app{height:min(100dvh - 32px,860px);width:430px;border-radius:34px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 24px 80px #000}#sheet{align-items:center}#sheet>div{max-width:430px;max-height:80%;border-radius:24px}}
.poster{cursor:pointer;min-width:0}
.cv{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--s2);border:1px solid var(--bd);box-shadow:0 6px 18px #0007}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#2d1b5e,#1a1a26)}
.poster b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25;margin-top:8px;font-weight:500}
.poster span{font-size:11px;color:var(--mu)}
#sheet{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet>div{background:#121219;border:1px solid var(--bd);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet>div:before{content:"";display:block;width:42px;height:4px;background:#ffffff33;border-radius:9px;margin:0 auto 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal button{padding:0;min-height:42px;position:relative;background:var(--s1);border:1px solid var(--bd);border-radius:12px}
.cal .sel{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0;box-shadow:0 3px 12px #7c3aed66}
.cal .dot:after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tag{display:inline-block;background:#8b5cf626;color:var(--ac2);border-radius:99px;padding:2px 10px;font-size:12px;margin-right:4px}
.big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 10px;letter-spacing:.02em}
.empty{text-align:center;color:var(--mu);padding:28px 12px;border:1px dashed #ffffff22;border-radius:18px;margin-bottom:10px}
@keyframes up{from{transform:translateY(34px);opacity:0}}
@media (prefers-reduced-motion:no-preference){#sheet>div{animation:up .25s ease-out}.bar i{transition:width .6s}}
</style></head><body>
<div id="app"><div id="main"></div>
<nav id="nav"></nav></div><div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sc"></div></div>
<script>
const APP_NAME="Playlog",SLOGAN="Your gaming story";document.title=APP_NAME;
const ST={playing:"Jugando",done:"Completados",backlog:"Backlog",wish:"Deseados"};
// Reglas XP centralizadas (derivadas de los registros: editar/borrar recalcula, sin farmeo)
const XP={session:10,perHour:20,maxMinPerDay:600,completed:100};
let S={games:[],sessions:[],user:{name:"Jugador"},timer:null,pref:""};
try{const r=localStorage.getItem("playlog_v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("playlog_v1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>ymd(new Date()),H=m=>S.unit==="m"?m+" min":(m/60).toFixed(1)+" h",fm=H;
const gm=id=>S.sessions.filter(s=>s.gameId===id).reduce((a,s)=>a+s.min,0);
const G=id=>S.games.find(g=>g.id===id);
const PLAT=["PC","PlayStation 5","PlayStation 4","PlayStation 3","PlayStation 2","PlayStation","PS Vita","PSP","Xbox Series X|S","Xbox One","Xbox 360","Xbox","Nintendo Switch","Nintendo Switch 2","Wii U","Wii","GameCube","Nintendo 64","SNES","NES","Nintendo 3DS","Nintendo DS","Game Boy Advance","Game Boy","Steam Deck","Mac","Linux","iOS","Android","Sega Mega Drive","Otra"];
let tab="home",lib={st:"playing",q:""},cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
function stats(){
 const dm={};S.sessions.forEach(s=>dm[s.date]=(dm[s.date]||0)+s.min);
 let xp=0;Object.values(dm).forEach(m=>xp+=Math.min(m,XP.maxMinPerDay)/60*XP.perHour);
 xp=Math.round(xp+S.sessions.length*XP.session+S.games.filter(g=>g.status==="done").length*XP.completed);
 const lv=Math.floor(Math.sqrt(xp/50))+1,lo=50*(lv-1)**2,hi=50*lv**2;
 const days=Object.keys(dm).sort();let rec=0,run=0,prev=null;
 days.forEach(d=>{const t=new Date(d+"T12:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;rec=Math.max(rec,run)});
 let cur=0,c=new Date();if(!dm[ymd(c)])c.setDate(c.getDate()-1);
 while(dm[ymd(c)]){cur++;c.setDate(c.getDate()-1)}
 return{xp,lv,lo,hi,dm,cur,rec:Math.max(rec,cur)};
}
function range(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a;
 if(p==="day")a=today();else if(p==="week"){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));a=ymd(d)}
 else if(p==="month")a=ymd(new Date(y,m,1));else a=ymd(new Date(y,0,1));
 return S.sessions.filter(s=>s.date>=a&&s.date<=today())}
function missions(){const w=range("week"),mo=range("month");
 return[{n:"Diaria: registra 1 sesión hoy",v:range("day").length,t:1},
 {n:"Semanal: 3 días activos",v:new Set(w.map(s=>s.date)).size,t:3},
 {n:"Mensual: 10 horas jugadas",v:Math.round(mo.reduce((a,s)=>a+s.min,0)/6)/10,t:10}]}
const bar=(v,t)=>`<div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div>`;
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',lib:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 13.5h.01"/>',diary:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function nav(){const t=[["home","Inicio"],["lib","Biblioteca"],["+",""],["diary","Diario"],["prof","Perfil"]];
 $("#nav").innerHTML=t.map(([k,l])=>k==="+"?`<button class="plus" aria-label="Añadir" onclick="openPlus()">+</button>`:`<button class="${tab===k?"on":""}" onclick="go('${k}')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}</button>`).join("")}
function go(t){tab=t;R()}
function R(){nav();$("#main").innerHTML=({home:vHome,lib:vLib,diary:vDiary,prof:vProf})[tab]();if(tab==="lib")list()}
function vHome(){const s=stats(),pl=S.games.filter(g=>g.status==="playing");
 return`<h1>¡Hola, ${e(S.user.name)}!</h1><div class="mu">${APP_NAME} · ${SLOGAN}</div>
 <div class="hero"><div class="ring" style="--p:${Math.round((s.xp-s.lo)/(s.hi-s.lo)*100)}"><b>${s.lv}</b><small>NIVEL</small></div><div style="flex:1"><div class="mu">${s.xp} XP</div><b style="font-size:17px">Faltan ${s.hi-s.xp} XP</b><div><span class="chip">🔥 ${s.cur} días de racha</span><span class="chip">🏆 récord ${s.rec}</span></div></div></div>
 <h2>Jugando ahora</h2>${pl.length?pl.map(gc).join(""):`<div class="empty">Aún no tienes juegos en curso.<br><button class="pri" onclick="go('lib')">Ir a la biblioteca</button></div>`}
 <h2>Misiones activas</h2>${missions().map(m=>`<div class="card"><div class="row sp"><span>${m.n}</span><span class="mu">${Math.min(m.v,m.t)}/${m.t}${m.v>=m.t?" ✅":""}</span></div>${bar(m.v,m.t)}</div>`).join("")}
 <h2>Noticias y lanzamientos</h2><div class="card mu">Sin conexión a una API real todavía: no se muestran noticias ni tendencias para no inventar datos. Conecta RAWG/IGDB y una fuente de noticias mediante una función serverless (pendiente).</div>`}
function gc(g){return`<div class="card row sp" onclick="openGame('${g.id}')" style="cursor:pointer"><div class="row">${g.cover?`<img src="${e(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:56px;height:56px;object-fit:cover;border-radius:8px">`:`<div style="width:56px;height:56px;border-radius:8px;background:var(--s2);display:grid;place-items:center">🎮</div>`}<div><b>${e(g.title)}</b><div class="mu">${e(g.platform||"—")} · ${H(gm(g.id))}</div></div></div><span>›</span></div>`}
function vLib(){return`<div class="row sp"><h1>Biblioteca</h1><button class="pri" onclick="catSearch()">+ Juego</button></div>
 <input type="search" enterkeyhint="search" placeholder="Buscar en mi biblioteca" value="${e(lib.q)}" oninput="lib.q=this.value;list()" style="margin-top:8px">
 <div class="tabs">${Object.entries(ST).map(([k,v])=>`<button class="${lib.st===k?"on":""}" onclick="lib.st='${k}';R()">${v}</button>`).join("")}
 </div>${lib.st==="backlog"?`<button style="width:100%;margin-bottom:12px" onclick="randomBacklog()">🎲 Juego aleatorio del Backlog</button>`:""}<div id="list"></div>`}
function gg(g){const rt=g.rating?.score;return`<div class="poster" onclick="openGame('${g.id}')"><div class="cv">${g.cover?`<img src="${e(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<div class="ph">🎮</div>`}</div><b>${e(g.title)}</b><span>${H(gm(g.id))}${rt?" · ⭐ "+rt:""}</span></div>`}
function list(){const q=lib.q.toLowerCase(),a=S.games.filter(g=>g.status===lib.st&&g.title.toLowerCase().includes(q));
 if(!a.length)return $("#list").innerHTML=`<div class="empty">No hay juegos aquí todavía.</div>`;
 if(lib.st!=="done")return $("#list").innerHTML=`<div class="grid">${a.map(gg).join("")}</div>`;
 const dd=g=>g.doneDate||g.rating?.date||"",yr=g=>dd(g).slice(0,4)||"Sin fecha",by={};a.forEach(g=>(by[yr(g)]=by[yr(g)]||[]).push(g));
 $("#list").innerHTML=Object.keys(by).sort((x,y)=>x==="Sin fecha"?1:y==="Sin fecha"?-1:y.localeCompare(x)).map(k=>`<h2>${k}</h2><div class="grid">${by[k].sort((x,y)=>dd(x).localeCompare(dd(y))).map(gg).join("")}</div>`).join("")}
function randomBacklog(){const b=S.games.filter(g=>g.status==="backlog");b.length?openGame(b[Math.floor(Math.random()*b.length)].id):alert("Tu backlog está vacío.")}
function sheet(h){$("#sc").innerHTML=h;$("#sheet").style.display="flex"}
function closeSheet(){$("#sheet").style.display="none";clearInterval(window._ti)}
function addGame(){addSheet(-1)}
function pl(g){return g?.platforms?.length?g.platforms:PLAT}
function platOpts(list,sel){return[...new Set([sel,...list].filter(Boolean))].map(p=>`<option ${p===sel?"selected":""}>${e(p)}</option>`).join("")}
function th(g,w,h){return g?.cover?`<img src="${e(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:${w}px;height:${h}px;object-fit:cover;border-radius:10px;flex:none">`:`<div style="width:${w}px;height:${h}px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none">🎮</div>`}
function addSheet(i){const b=i>=0?CR[i]:{title:""};
 sheet(`<div class="row sp"><h1>Añadir juego</h1><button onclick="closeSheet()">✕</button></div>
 ${i>=0?`<div class="row">${th({cover:b.cover},56,74)}<b>${e(b.title)}</b></div>`:`<label>Título</label><input id="gt" autocapitalize="words">`}
 <label>¿Dónde lo añadimos?</label><select id="gs" onchange="$('#gd').style.display=this.value==='done'?'block':'none'">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===lib.st?"selected":""}>${v}</option>`).join("")}</select>
 <label>Plataforma</label><select id="gp">${platOpts(pl(b),"")}</select>
 <label>Formato</label><select id="gf"><option>Digital</option><option>Físico</option></select>
 <div id="gd" style="display:${lib.st==="done"?"block":"none"}"><label>Fecha de finalización</label><input type="date" id="gdt" value="${today()}"><label>Tiempo de juego total (horas, opcional)</label><input type="number" id="gh" min="0" step="0.5" inputmode="decimal"></div>
 <button class="pri" style="width:100%;margin-top:16px" onclick="saveGame(${i})">Guardar</button>`)}
function saveGame(i){const b=i>=0?CR[i]:{},t=i>=0?b.title:$("#gt").value.trim().slice(0,120);if(!t)return alert("Escribe un título");
 const st=$("#gs").value,id=uid(),p=$("#gp").value;
 const g={id,title:t,platform:p,platforms:b.platforms||[],genre:(b.genres||[]).join(", "),format:$("#gf").value,status:st,notes:"",goals:[],rating:null,cover:b.cover||"",released:b.released||"",summary:b.summary||"",tags:b.tags||[],similar:b.similar||[],ttb:b.ttb||null,run:1};
 if(st==="done"){g.doneDate=$("#gdt").value||today();const h=parseFloat($("#gh").value);if(h>0)S.sessions.push({id:uid(),gameId:id,date:g.doneDate,platform:p,min:Math.round(h*60),note:"Tiempo total al completar",run:1})}
 S.games.push(g);if(p)S.pref=p;save();closeSheet();R()}
function openGame(id){const g=G(id);if(!g)return;const gl=g.goals,dn=gl.filter(x=>x.done).length,t=g.ttb||{};
 const ss=S.sessions.filter(s=>s.gameId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),dm=d=>d.split("-").reverse().join("/");
 sheet(`${g.cover?`<img src="${e(g.cover)}" alt="Portada" referrerpolicy="no-referrer" style="width:100%;height:230px;object-fit:contain;background:var(--s2);border-radius:12px;margin-bottom:10px">`:""}<div class="row sp"><h1>${e(g.title)}</h1><button onclick="closeSheet()">✕</button></div>
 <div class="mu">${e(g.platform||"—")} · ${e(g.genre||"—")} · ${g.format} · ${H(gm(id))}${g.run>1?" · Partida "+g.run:""}</div>
 <label>Estado</label><select onchange="setStatus('${id}',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${g.status===k?"selected":""}>${v}</option>`).join("")}</select>
 <div class="row" style="margin-top:8px">${g.status==="done"?`<button onclick="replay('${id}')">🔁 Rejugar</button>`:""}<button onclick="setCover('${id}')">🖼 Cambiar portada</button></div>
 ${g.rating?`<div class="card" style="margin-top:10px">⭐ ${g.rating.score??"—"}/10 ${g.rating.date?"· "+g.rating.date:""}<div class="mu">${e(g.rating.review||"")}</div><button onclick="rate('${id}')">Editar valoración</button></div>`:""}
 ${t.main||t.extra||t.full?`<h2>Duración estimada</h2><div class="stats" style="grid-template-columns:repeat(3,1fr)">${[["main","Historia"],["extra","Hist. + extras"],["full","100%"]].map(([k,l])=>`<div><b>${t[k]?t[k]+" h":"—"}</b><span>${l}</span></div>`).join("")}</div>`:""}
 ${g.tags?.length?`<h2>Etiquetas</h2>${g.tags.map(x=>`<span class="tag">${e(x)}</span>`).join("")}`:""}
 ${g.summary?`<h2>Resumen</h2><div class="mu">${e(g.summary)}</div>`:""}
 ${g.similar?.length?`<h2>Juegos similares</h2>${g.similar.map(x=>`<span class="tag">${e(x)}</span>`).join("")}`:""}
 <h2>Objetivos</h2>${gl.length?`<div class="mu">${Math.round(dn/gl.length*100)}% (${dn}/${gl.length}) · Objetivos personalizados: no son logros verificados automáticamente.</div>`:`<div class="mu">Sin objetivos: no se muestra porcentaje.</div>`}
 ${gl.map((x,i)=>`<div class="row" style="margin-top:6px"><input type="checkbox" style="width:24px;min-height:24px" ${x.done?"checked":""} onchange="goal('${id}',${i})"><span style="flex:1">${e(x.name)}</span><button class="dng" onclick="delGoal('${id}',${i})">✕</button></div>`).join("")}
 <div class="row" style="margin-top:8px"><input id="ng" placeholder="Nuevo objetivo"><button onclick="addGoal('${id}')">Añadir</button></div>
 <h2>Notas</h2><textarea onchange="G('${id}').notes=this.value;save()">${e(g.notes)}</textarea>
 <h2>Sesiones recientes</h2>${ss.map(s=>`<div class="mu">${dm(s.date)} - ${fm(s.min)}${s.note?" - "+e(s.note):""}${s.run>1?" (Partida "+s.run+")":""}</div>`).join("")||`<div class="mu">Ninguna</div>`}
 <button class="dng" style="margin-top:16px" onclick="delGame('${id}')">Eliminar juego</button>`)}
function replay(id){const g=G(id);g.run=(g.run||1)+1;g.status="playing";save();openGame(id);R()}
function setCover(id){const u=prompt("Pega el enlace (URL) de la imagen de portada:");if(u&&/^https?:\/\//.test(u.trim())){G(id).cover=u.trim();save();openGame(id);R()}}
function setStatus(id,v){const g=G(id),was=g.status;g.status=v;if(v==="done"&&was!=="done"){g.doneDate=today();save();rate(id)}else{save();openGame(id);R()}}
function rate(id){const r=G(id).rating||{};sheet(`<h1>Valoración (opcional)</h1><label>Fecha de finalización</label><input type="date" id="rd" value="${r.date||today()}">
 <label>Nota (1-10)</label><input type="number" id="rs" min="1" max="10" value="${r.score??""}"><label>Reseña</label><textarea id="rr">${e(r.review||"")}</textarea>
 <div class="row" style="margin-top:14px"><button onclick="openGame('${id}');R()">Omitir</button><button class="pri" onclick="saveRate('${id}')">Guardar</button></div>`)}
function saveRate(id){let n=parseInt($("#rs").value);n=n>=1&&n<=10?n:null;const d=$("#rd").value;G(id).rating={date:d,score:n,review:$("#rr").value.slice(0,2000)};if(d)G(id).doneDate=d;save();openGame(id);R()}
function goal(id,i){const x=G(id).goals[i];x.done=!x.done;save();openGame(id)}
function delGoal(id,i){G(id).goals.splice(i,1);save();openGame(id)}
function addGoal(id){const n=$("#ng").value.trim();if(n){G(id).goals.push({name:n.slice(0,100),done:false});save();openGame(id)}}
function delGame(id){if(!confirm("¿Eliminar el juego y sus sesiones?"))return;S.games=S.games.filter(g=>g.id!==id);S.sessions=S.sessions.filter(s=>s.gameId!==id);save();closeSheet();R()}
// Cronómetro con marcas temporales persistidas
const el=()=>{const t=S.timer;return t?t.acc+(t.run?Date.now()-t.start:0):0};
function openPlus(){sheet(`<h1 style="text-align:center">¿Qué quieres hacer?</h1><div style="display:grid;gap:10px;margin-top:14px"><button class="pri" style="width:100%;padding:16px" onclick="closeSheet();go('lib');catSearch()">🎮 Añadir un juego a mi biblioteca</button><button style="width:100%;padding:16px" onclick="openLog()">📖 Registrar una sesión en el diario</button></div>`)}
function openLog(d){const opts=S.games.filter(g=>g.status==="playing");
 if(!opts.length){return sheet(`<div class="empty">No tienes ningún juego en <b>Jugando</b>.<br>Añade uno o cambia el estado de un juego de tu biblioteca.<br><br><button class="pri" onclick="closeSheet();go('lib');catSearch()">Añadir juego</button> <button onclick="closeSheet();go('lib')">Ir a la biblioteca</button></div>`)}
 sheet(`<div class="row sp"><h1>Registrar sesión</h1><button onclick="closeSheet()">✕</button></div>
 <label>Juego</label><select id="lg" onchange="const g=G(this.value);$('#lp').innerHTML=platOpts(pl(g),g.platform||S.pref)">${opts.map(g=>`<option value="${g.id}">${e(g.title)}</option>`).join("")}</select>
 <label>Fecha</label><input type="date" id="ld" value="${typeof d==="string"?d:today()}"><label>Plataforma</label><select id="lp">${platOpts(pl(opts[0]),opts[0].platform||S.pref)}</select>
 <div class="card" style="margin-top:12px"><div class="big" id="tm">00:00:00</div><div class="row" id="tb"></div></div>
 <label>Duración (minutos)</label><input type="number" id="lm" min="1" max="1440" inputmode="numeric"><label>Nota (opcional)</label><textarea id="ln" maxlength="500"></textarea>
 <button class="pri" style="width:100%;margin-top:14px" onclick="saveSession()">Guardar sesión</button>`);
 window._sid=uid();tb();window._ti=setInterval(tick,500);tick()}
function tick(){const x=$("#tm");if(!x)return;const s=Math.floor(el()/1e3);x.textContent=[s/3600,s/60%60,s%60].map(v=>String(Math.floor(v)).padStart(2,"0")).join(":")}
function tb(){const t=S.timer;$("#tb").innerHTML=!t?`<button class="pri" onclick="tm('start')">▶ Iniciar</button>`:t.run?`<button onclick="tm('pause')">⏸ Pausar</button><button onclick="tm('stop')">⏹ Detener</button>`:`<button class="pri" onclick="tm('resume')">▶ Reanudar</button><button onclick="tm('stop')">⏹ Detener</button>`}
function tm(a){const t=S.timer,n=Date.now();
 if(a==="start")S.timer={start:n,acc:0,run:true};
 if(a==="pause"){t.acc+=n-t.start;t.run=false}
 if(a==="resume"){t.start=n;t.run=true}
 if(a==="stop"){const m=Math.max(1,Math.round(el()/6e4));S.timer=null;$("#lm").value=m}
 save();tb();tick()}
function saveSession(){const m=parseInt($("#lm").value);if(!(m>=1&&m<=1440))return alert("Indica una duración válida (o usa el cronómetro y pulsa Detener).");
 if(S.sessions.some(s=>s.id===window._sid))return;const g=G($("#lg").value),p=$("#lp").value;
 S.sessions.push({id:window._sid,gameId:g.id,date:$("#ld").value||today(),platform:p,min:m,note:$("#ln").value.slice(0,500),run:g.run||1});
 g.platform=p;S.pref=p;save();closeSheet();R()}
function vDiary(){const{y,m,sel}=cal,dm=stats().dm,f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let c="";for(let i=0;i<f;i++)c+="<span></span>";
 for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d));c+=`<button class="${dm[k]?"dot":""} ${k===sel?"sel":""}" onclick="cal.sel='${k}';R()">${d}</button>`}
 const ss=S.sessions.filter(s=>s.date===sel),tot=ss.reduce((a,s)=>a+s.min,0);
 return`<div class="row sp"><button onclick="cm(-1)" aria-label="Mes anterior">‹</button><h1>${new Date(y,m,1).toLocaleDateString("es",{month:"long",year:"numeric"})}</h1><button onclick="cm(1)" aria-label="Mes siguiente">›</button></div>
 <div class="cal mu" style="margin:8px 0">${["L","M","X","J","V","S","D"].map(d=>`<span>${d}</span>`).join("")}</div><div class="cal">${c}</div>
 <div class="row sp"><h2 style="margin:20px 0 10px">${sel.split("-").reverse().join("/")} · ${fm(tot)}</h2><button style="min-height:36px" onclick="cal.y=new Date().getFullYear();cal.m=new Date().getMonth();cal.sel=today();R()">Hoy</button></div>
 ${ss.map(s=>{const g=G(s.gameId);return`<div class="card row" style="cursor:pointer" onclick="editS('${s.id}')">${th(g,52,70)}<div style="min-width:0"><b>${e(g?.title||"?")}</b><div class="mu">${e(s.platform||"—")} · ${fm(s.min)}</div>${s.note?`<div class="mu">${e(s.note)}</div>`:""}</div></div>`}).join("")||`<div class="empty">Sin sesiones este día.</div>`}
 <button class="pri" style="width:100%" onclick="openLog(cal.sel)">+ Registrar sesión el ${sel.split("-").reverse().join("/")}</button>`}
function cm(d){cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}R()}
function editS(id){const s=S.sessions.find(x=>x.id===id),g=G(s.gameId)||{};sheet(`<div class="row sp"><h1>Editar sesión</h1><button onclick="closeSheet()">✕</button></div>
 <div class="card row">${th(g,56,74)}<div><b>${e(g.title||"?")}</b><div class="mu">${fm(s.min)}${s.run>1?" · Partida "+s.run:""}</div></div></div>
 <label>Plataforma</label><select id="ep">${platOpts(pl(g),s.platform)}</select><label>Fecha</label><input type="date" id="ed" value="${s.date}"><label>Minutos</label><input type="number" id="em" min="1" max="1440" value="${s.min}">
 <label>Nota</label><textarea id="en">${e(s.note)}</textarea><div class="row" style="margin-top:14px"><button class="dng" onclick="delS('${id}')">Eliminar</button><button class="pri" onclick="updS('${id}')">Guardar</button></div>`)}
function updS(id){const s=S.sessions.find(x=>x.id===id),m=parseInt($("#em").value);if(!(m>=1&&m<=1440))return alert("Duración no válida");s.min=m;s.platform=$("#ep").value;s.date=$("#ed").value||s.date;s.note=$("#en").value.slice(0,500);save();closeSheet();R()}
function delS(id){if(confirm("¿Eliminar esta sesión? XP y horas se recalcularán.")){S.sessions=S.sessions.filter(x=>x.id!==id);save();closeSheet();R()}}
function vProf(){const s=stats(),tot=S.sessions.reduce((a,x)=>a+x.min,0),yr=String(new Date().getFullYear()),
 top=S.games.map(g=>[g,gm(g.id)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,3),gen={},plt={};
 S.sessions.forEach(x=>{const g=G(x.gameId);(g?.genre||"").split(",").map(z=>z.trim()).filter(Boolean).forEach(z=>gen[z]=(gen[z]||0)+x.min);if(x.platform)plt[x.platform]=(plt[x.platform]||0)+x.min});
 const best=S.games.filter(g=>g.rating?.score&&(g.doneDate||g.rating.date||"").startsWith(yr)).sort((a,b)=>b.rating.score-a.rating.score).slice(0,5);
 const per=[["week","Esta semana"],["month","Este mes"],["year","Este año"]].map(([p,l])=>{const r=range(p),h=(r.reduce((a,x)=>a+x.min,0)/60).toFixed(1);return`<div class="card"><b>${l}</b><div class="stats"><div><b>${h}</b><span>horas</span></div><div><b>${r.length}</b><span>sesiones</span></div><div><b>${new Set(r.map(x=>x.gameId)).size}</b><span>juegos</span></div><div><b>${new Set(r.map(x=>x.date)).size}</b><span>días</span></div></div></div>`}).join("");
 return`<div class="card row"><label style="margin:0;cursor:pointer;flex:none">${S.user.avatar?`<img src="${S.user.avatar}" alt="Avatar" style="width:64px;height:64px;border-radius:50%;object-fit:cover">`:`<div style="font-size:34px;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:var(--s2)">🎮</div>`}<input type="file" accept="image/*" hidden onchange="setAvatar(this)"></label><div style="flex:1"><input value="${e(S.user.name)}" onchange="S.user.name=this.value.slice(0,30)||'Jugador';save()"><div class="mu">Toca la foto para cambiarla · Nivel ${s.lv} · ${s.xp}/${s.hi} XP</div></div></div>${bar(s.xp-s.lo,s.hi-s.lo)}
 <h2>Estadísticas</h2><div class="card">🔥 Racha: ${s.cur} d · Récord: ${s.rec} d<br>⏱ ${H(tot)} · ${S.sessions.length} sesiones · ${S.games.filter(g=>g.status==="done").length} completados</div>${per}
 ${pie(gen,"Géneros más jugados")}${pie(plt,"Plataformas más jugadas")}
 <h2>Mejor valorados de ${yr}</h2>${best.map(g=>`<div class="card row">${th(g,40,54)}<b style="flex:1">${e(g.title)}</b><span>⭐ ${g.rating.score}</span></div>`).join("")||`<div class="empty">Completa y puntúa juegos este año para verlos aquí.</div>`}
 <h2>Más jugados</h2>${top.map(([g,m])=>`<div class="card row sp">${e(g.title)}<span class="mu">${H(m)}</span></div>`).join("")||`<div class="empty">Registra sesiones para ver tu top.</div>`}
 <h2>Ajustes</h2><div class="card"><label style="margin-top:0">Mostrar el tiempo de juego en</label><div class="row"><button class="${S.unit!=="m"?"pri":""}" style="flex:1" onclick="S.unit='h';save();R()">Horas</button><button class="${S.unit==="m"?"pri":""}" style="flex:1" onclick="S.unit='m';save();R()">Minutos</button></div>
 <div class="mu" style="margin-top:12px">Datos guardados solo en este navegador (modo local).</div>
 <div class="row" style="margin-top:8px"><button onclick="exp()">Exportar JSON</button><button class="dng" onclick="if(confirm('¿Borrar todos los datos?')){localStorage.removeItem('playlog_v1');location.reload()}">Borrar datos</button></div></div>
 <div class="mu">${APP_NAME} MVP · Premium: estructura futura, sin cobros.</div>`}
const PC=["#8b5cf6","#34d399","#f59e0b","#f87171","#38bdf8","#f472b6","#a3e635"];
function pie(o,t){const a=Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,7),sum=a.reduce((n,x)=>n+x[1],0);if(!sum)return`<h2>${t}</h2><div class="empty">Aún no hay datos.</div>`;let acc=0;
 const g=a.map(([k,v],i)=>{const st=acc/sum*100;acc+=v;return`${PC[i]} ${st}% ${acc/sum*100}%`}).join(",");
 return`<h2>${t}</h2><div class="card row"><div class="pie" style="background:conic-gradient(${g})"></div><div style="flex:1;min-width:0">${a.map(([k,v],i)=>`<div class="row" style="font-size:13px"><i style="width:10px;height:10px;border-radius:50%;background:${PC[i]};flex:none"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(k)}</span><span class="mu">${Math.round(v/sum*100)}%</span></div>`).join("")}</div></div>`}
function setAvatar(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.user.avatar=c.toDataURL("image/jpeg",.8);save();R()};im.src=URL.createObjectURL(f)}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="playlog.json";a.click()}
let CR=[];
function catSearch(){
 sheet(`<div class="row sp"><h1>Buscar juegos</h1><button onclick="closeSheet()">✕</button></div><div class="row"><input id="cq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Ej: Pokémon" onkeydown="if(event.key==='Enter')catGo()"><button class="pri" onclick="catGo()">Buscar</button></div><div id="cr"></div><div class="card" style="margin-top:12px"><div class="mu">¿No encuentras tu juego (por ejemplo un fangame)?</div><button style="width:100%;margin-top:8px" onclick="addGame()">✍️ Crear ficha manual</button></div><div class="mu" style="margin-top:10px">Datos: <a href="https://rawg.io" style="color:var(--ac2)">RAWG</a></div>`)}
async function catGo(){const q=$("#cq").value.trim();if(q.length<2)return;$("#cr").innerHTML=`<div class="empty">Buscando…</div>`;
 const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("error "+r.status);return r.json()};
 try{let d;try{d=await get("/.netlify/functions/igdb?q="+encodeURIComponent(q))}catch(_){d=await get("/.netlify/functions/search?q="+encodeURIComponent(q))}
 CR=(d.results||[]).map(g=>g.title?g:{title:g.name,released:g.released,cover:g.background_image,platforms:(g.platforms||[]).map(p=>p.platform.name),genres:(g.genres||[]).map(x=>x.name),tags:[],similar:[],summary:"",ttb:null});
 $("#cr").innerHTML=CR.length?CR.map((g,i)=>`<div class="card row sp"><div class="row" style="flex:1;min-width:0">${th(g,48,64)}<div style="min-width:0"><b>${e(g.title)}</b><div class="mu">${e((g.released||"s/f").slice(0,4))} · ${e((g.platforms||[]).slice(0,3).join(", "))}</div></div></div><button class="pri" onclick="addSheet(${i})">Añadir</button></div>`).join(""):`<div class="empty">Sin resultados.</div>`}
 catch(x){$("#cr").innerHTML=`<div class="empty">No se pudo buscar (${e(x.message)}).<br><button onclick="catGo()">Reintentar</button></div>`}}
R();
</script></body></html>
