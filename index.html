<script>
const APP_NAME="Playlog",SLOGAN="Your gaming story";document.title=APP_NAME;
const ST={playing:"Jugando",done:"Completados",backlog:"Backlog",wish:"Deseados",drop:"Abandonados"};
// Reglas XP centralizadas (derivadas de los registros: editar/borrar recalcula, sin farmeo)
const XP={session:10,perHour:20,maxMinPerDay:600,completed:100};
let S={games:[],sessions:[],user:{name:"Jugador"},timer:null,pref:""};
try{const r=localStorage.getItem("playlog_v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("playlog_v1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>ymd(new Date()),H=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+"h "+r+"min":h+"h"):r+"min"},fm=H;
const gm=id=>S.sessions.filter(s=>s.gameId===id).reduce((a,s)=>a+s.min,0);
const G=id=>S.games.find(g=>g.id===id);
const PLAT=["PC","PlayStation 5","PlayStation 4","PlayStation 3","PlayStation 2","PlayStation","PS Vita","PSP","Xbox Series X|S","Xbox One","Xbox 360","Xbox","Nintendo Switch","Nintendo Switch 2","Wii U","Wii","GameCube","Nintendo 64","SNES","NES","Nintendo 3DS","Nintendo DS","Game Boy Advance","Game Boy","Steam Deck","Mac","Linux","iOS","Android","Consola Android","Game Boy Color","Sega Master System","Sega Mega Drive","Sega Saturn","Dreamcast","Neo Geo","PC Engine","Atari 2600","Anbernic","Retroid Pocket","Miyoo Mini","Powkiddy","Ayn Odin","Ayaneo","ROG Ally","Lenovo Legion Go","MSI Claw","Analogue Pocket","Playdate","Meta Quest","Steam Machine","Otra"];
const GEN=["Adventure","Arcade","Card & Board Game","Fighting","Hack and slash/Beat 'em up","Indie","MOBA","Music","Pinball","Platform","Point-and-click","Puzzle","Quiz/Trivia","Racing","Real Time Strategy (RTS)","Role-playing (RPG)","Shooter","Simulator","Sport","Strategy","Tactical","Turn-based strategy (TBS)","Visual Novel"];
const APP_VER="2026-10-17";
const fd=d=>d?d.split("-").reverse().join("/"):"";
let tab="home",lib={st:"playing",q:"",f:{pl:"",gen:"",fmt:"",sort:"name"}},cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
function stats(){
 const dm={};S.sessions.forEach(s=>dm[s.date]=(dm[s.date]||0)+s.min);
 let xp=0;Object.values(dm).forEach(m=>xp+=Math.min(m,XP.maxMinPerDay)/60*XP.perHour);
 xp=Math.round(xp+S.sessions.length*XP.session+S.games.filter(g=>g.status==="done").length*XP.completed);
 const lv=Math.floor(Math.sqrt(xp/50))+1,lo=50*(lv-1)**2,hi=50*lv**2;
 const days=Object.keys(dm).sort();let rec=0,run=0,prev=null;
 days.forEach(d=>{const t=new Date(d+"T12:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;rec=Math.max(rec,run)});
 let cur=0,c=new Date();if(!dm[ymd(c)])c.setDate(c.getDate()-1);
 while(dm[ymd(c)]){cur++;c.setDate(c.getDate()-1)}
 return{xp,lv,lo,hi,dm,cur,rec:Math.max(rec,cur)};
}
function range(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a;
 if(p==="day")a=today();else if(p==="week"){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));a=ymd(d)}
 else if(p==="month")a=ymd(new Date(y,m,1));else a=ymd(new Date(y,0,1));
 return S.sessions.filter(s=>s.date>=a&&s.date<=today())}
function missions(){const w=range("week"),mo=range("month");
 return[{n:"Diaria: registra 1 sesión hoy",v:range("day").length,t:1},
 {n:"Semanal: 3 días activos",v:new Set(w.map(s=>s.date)).size,t:3},
 {n:"Mensual: 10 horas jugadas",v:Math.round(mo.reduce((a,s)=>a+s.min,0)/6)/10,t:10}]}
const bar=(v,t)=>`<div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div>`;
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',lib:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 13.5h.01"/>',diary:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};

function setAvatar(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.user.avatar=c.toDataURL("image/jpeg",.8);save();R()};im.src=URL.createObjectURL(f)}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="playlog.json";a.click()}
let CR=[];
function catSearch(){
 sheet(`<div class="row sp"><h1>Buscar juegos</h1><button onclick="closeSheet()">✕</button></div><div class="row"><input id="cq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Ej: Pokémon" onkeydown="if(event.key==='Enter')catGo()"><button class="pri" onclick="catGo()">Buscar</button></div><div id="cr"></div><div class="card" style="margin-top:12px"><div class="mu">¿No encuentras tu juego (por ejemplo un fangame)?</div><button style="width:100%;margin-top:8px" onclick="addGame()">✍️ Crear ficha manual</button></div><div class="mu" style="margin-top:10px">Datos: <a href="https://rawg.io" style="color:var(--ac2)">RAWG</a></div>`)}
async function catGo(){const q=$("#cq").value.trim();if(q.length<2)return;window._lastQ=q;$("#cr").innerHTML=`<div class="empty">Buscando…</div>`;
 const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("error "+r.status);return r.json()};
 try{let d;try{d=await get("/.netlify/functions/igdb?q="+encodeURIComponent(q))}catch(_){d=await get("/.netlify/functions/search?q="+encodeURIComponent(q))}
 CALL=(d.results||[]).map(g=>g.title?g:{title:g.name,released:g.released,cover:g.background_image,platforms:(g.platforms||[]).map(p=>p.platform.name),genres:(g.genres||[]).map(x=>x.name),tags:[],similar:[],summary:"",ttb:null,versions:[]}).sort((a,b)=>(b.released||"").localeCompare(a.released||""));catRender()}
 catch(x){$("#cr").innerHTML=catEmpty("No se pudo buscar ("+e(x.message)+"). Revisa tu conexión.")}}
// iPhone (app instalada): si iOS recorta la altura de la web por debajo (franja vacía abajo), se marca <html class="gap"> y la barra se pega al borde visible
(function(){const fix=()=>{try{const r=document.documentElement;if(navigator.standalone!==true){r.classList.remove("gap");return}
 const pr=innerHeight>innerWidth,sh=pr?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height),pb=document.createElement("div");
 pb.style.cssText="position:fixed;top:0;bottom:0;left:0;width:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none";document.body.appendChild(pb);
 const h=pb.getBoundingClientRect().height,it=parseFloat(getComputedStyle(pb).paddingTop)||0;pb.remove();
 const g=Math.round(sh-h);r.classList.toggle("gap",g>0&&g<=100&&it>0)}catch(_){}};
 fix();addEventListener("resize",fix);addEventListener("orientationchange",()=>setTimeout(fix,300))})();
// Deslizar hacia abajo (desde arriba del todo) cierra las ventanas y los recaps
(function(){let sy=0,sx=0,dy=0,t=null,mode="",eng=false,on=false;
 const reset=()=>{t.style.transition="";t.style.transform="";t.style.opacity=""};
 document.addEventListener("touchstart",ev=>{on=false;eng=false;if(ev.touches.length!==1)return;
  const sh=$("#sheet"),rc=$("#rc");
  if(sh.style.display==="flex"&&sh.contains(ev.target)){t=$("#sheet>div");mode="sheet";if(t.scrollTop>0)return}
  else if(rc.style.display==="flex"&&rc.contains(ev.target)){t=rc;mode="rc";const bd=ev.target.closest&&ev.target.closest(".rc-body");if(bd&&bd.scrollTop>0)return}
  else return;
  if(ev.target.closest&&ev.target.closest("textarea,input,select"))return;
  sy=ev.touches[0].clientY;sx=ev.touches[0].clientX;dy=0;on=true},{passive:true});
 document.addEventListener("touchmove",ev=>{if(!on)return;const y=ev.touches[0].clientY-sy,x=ev.touches[0].clientX-sx;
  if(!eng){if(y<-6||Math.abs(x)>Math.abs(y)+4&&Math.abs(x)>10){on=false;return}if(y<=8)return;eng=true}
  dy=Math.max(0,y);if(ev.cancelable)ev.preventDefault();t.style.transition="none";t.style.transform="translateY("+dy*.9+"px)";if(mode==="rc")t.style.opacity=String(1-Math.min(.6,dy/500))},{passive:false});
 document.addEventListener("touchend",ev=>{if(!on||!eng){on=false;return}on=false;eng=false;if(ev.cancelable)ev.preventDefault();
  const el=t,m=mode;
  if(dy>110){el.style.transition="transform .2s ease-out, opacity .2s";el.style.transform="translateY("+(m==="rc"?innerHeight:el.offsetHeight)+"px)";if(m==="rc")el.style.opacity="0";
   setTimeout(()=>{if(m==="sheet")closeSheet();else el.style.display="none";el.style.transition="";el.style.transform="";el.style.opacity=""},200)}
  else{el.style.transition="transform .2s ease-out, opacity .2s";el.style.transform="";el.style.opacity="";setTimeout(()=>{el.style.transition=""},220)}},{passive:false});
 document.addEventListener("touchcancel",()=>{if(on&&eng){reset()}on=false;eng=false})})();
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){closeSheet();$("#rc").style.display="none"}});
R();
</script></body></html>
