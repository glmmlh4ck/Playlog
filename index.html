<style>
:root{--bg:#0b0b10;--s1:#15151d;--s2:#1e1e29;--bd:rgba(255,255,255,.07);--tx:#f4f4f8;--mu:#9494a8;--ac:#8b5cf6;--ac2:#b69dff;--ok:#34d399;--er:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

button,input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:46px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #8b5cf63d}
button{cursor:pointer;width:auto;font-weight:500;transition:transform .12s,background .2s}button:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0;font-weight:600;box-shadow:0 4px 14px #7c3aed66}.dng{color:var(--er)}
textarea{min-height:76px}label{display:block;margin:12px 0 5px;color:var(--mu);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}.tabs button:nth-child(-n+3){grid-column:span 2}.tabs button:nth-child(n+4){grid-column:span 3}.tabs button{width:100%;white-space:nowrap;min-height:40px;padding:6px 0;font-size:12px;text-align:center;border-radius:99px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--mu)}.pie{width:110px;height:110px;border-radius:50%;flex:none;position:relative}.pie:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--s1)}
.tabs .on{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0;box-shadow:0 3px 12px #7c3aed66}

nav button.on{color:var(--ac2)}nav button.on:after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--ac2);box-shadow:0 0 8px var(--ac)}
nav .plus{background:linear-gradient(135deg,#7c3aed,#a47bff);color:#fff;border-radius:50%;width:58px;height:58px;margin-top:-28px;font-size:32px;font-weight:300;justify-content:center;box-shadow:0 0 0 6px var(--bg),0 8px 22px #7c3aedaa}
.hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:22px;margin:14px 0 4px;background:linear-gradient(135deg,#2e1a69,#171727);border:1px solid #8b5cf655;box-shadow:0 10px 30px #5b2fd144}
.ring{width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--ac2) calc(var(--p)*1%),#ffffff1c 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#1b1536}.ring>*{position:relative}.ring b{font-size:28px;line-height:1}.ring small{font-size:9px;letter-spacing:.14em;color:var(--mu)}
.chip{display:inline-block;background:#ffffff14;border-radius:99px;padding:3px 11px;font-size:12px;margin:8px 6px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
#main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}button{touch-action:manipulation}
input,select,textarea{font-size:16px}h1{font-size:24px}.tabs button{min-height:42px}nav button{min-height:48px;min-width:64px}
@media(min-width:600px){body{background:#050508;display:grid;place-items:center}#app{height:min(100dvh - 32px,860px);width:430px;border-radius:34px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 24px 80px #000}#sheet{align-items:center}#sheet>div{max-width:430px;max-height:80%;border-radius:24px}}
.poster{cursor:pointer;min-width:0}
.cv{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--s2);border:1px solid var(--bd);box-shadow:0 6px 18px #0007}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#2d1b5e,#1a1a26)}
.poster b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25;margin-top:8px;font-weight:500}
.poster span{font-size:11px;color:var(--mu)}

#sheet>div{background:#121219;border:1px solid var(--bd);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet>div:before{content:"";display:block;width:42px;height:4px;background:#ffffff33;border-radius:9px;margin:0 auto 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal button{padding:0;min-height:42px;position:relative;background:var(--s1);border:1px solid var(--bd);border-radius:12px}
.cal .sel{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0;box-shadow:0 3px 12px #7c3aed66}
.cal .dot:after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tag{display:inline-block;background:#8b5cf626;color:var(--ac2);border-radius:99px;padding:2px 10px;font-size:12px;margin-right:4px}
.big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 10px;letter-spacing:.02em}
.empty{text-align:center;color:var(--mu);padding:28px 12px;border:1px dashed #ffffff22;border-radius:18px;margin-bottom:10px}
@keyframes up{from{transform:translateY(34px);opacity:0}}
@media (prefers-reduced-motion:no-preference){#sheet>div{animation:up .25s ease-out}.bar i{transition:width .6s}}
.chipb{display:inline-block;padding:7px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--bd);margin:0 6px 8px 0;font-size:13px;cursor:pointer}.chipb.on{background:linear-gradient(135deg,#7c3aed,#9d6bff);border-color:transparent}
summary{cursor:pointer;color:var(--ac2);padding:10px 0}
#rc{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;padding:60px 28px 50px}
.rc-bars{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:60px;display:flex;gap:4px}.rc-bars i{flex:1;height:4px;border-radius:9px;background:#ffffff44}.rc-bars i.on{background:#fff}
.rc-x{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:10px;width:46px;background:none;border:0;font-size:22px;color:#fff}.rc-body{width:100%;max-width:420px}
.rc-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}.rc-hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));opacity:.8;font-size:13px}
@media (prefers-reduced-motion:no-preference){.rc-body{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}}
.cal button.sel{background:linear-gradient(135deg,#7c3aed,#9d6bff);border:0}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;opacity:.55}
.bd.on{opacity:1;border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}.bd b{display:block;font-size:12px;line-height:1.2;margin-top:2px}.bd span{display:block;font-size:10px;color:var(--mu)}
.cv .fan{position:absolute;top:6px;left:6px;z-index:1;background:#000b;border-radius:8px;padding:2px 7px;font-size:10px;font-style:normal;font-weight:700}
.cal .gold{box-shadow:inset 0 0 0 2px #f5c518;color:#f5c518;font-weight:700}.cal .gold:before{content:"★";position:absolute;top:1px;right:4px;font-size:10px}
</style></head><body>
<div id="app"><div id="main"></div>
<nav id="nav"></nav></div><div id="rc" onclick="rcTap(event)"></div><div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sc"></div></div>
<script>
const APP_NAME="Playlog",SLOGAN="Your gaming story";document.title=APP_NAME;
const ST={playing:"Jugando",done:"Completados",backlog:"Backlog",wish:"Deseados",drop:"Abandonados"};
// Reglas XP centralizadas (derivadas de los registros: editar/borrar recalcula, sin farmeo)
const XP={session:10,perHour:20,maxMinPerDay:600,completed:100};
let S={games:[],sessions:[],user:{name:"Jugador"},timer:null,pref:""};
try{const r=localStorage.getItem("playlog_v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("playlog_v1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>ymd(new Date()),H=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+"h "+r+"min":h+"h"):r+"min"},fm=H;
const gm=id=>S.sessions.filter(s=>s.gameId===id).reduce((a,s)=>a+s.min,0);
const G=id=>S.games.find(g=>g.id===id);
const PLAT=["PC","PlayStation 5","PlayStation 4","PlayStation 3","PlayStation 2","PlayStation","PS Vita","PSP","Xbox Series X|S","Xbox One","Xbox 360","Xbox","Nintendo Switch","Nintendo Switch 2","Wii U","Wii","GameCube","Nintendo 64","SNES","NES","Nintendo 3DS","Nintendo DS","Game Boy Advance","Game Boy","Steam Deck","Mac","Linux","iOS","Android","Consola Android","Game Boy Color","Sega Master System","Sega Mega Drive","Sega Saturn","Dreamcast","Neo Geo","PC Engine","Atari 2600","Anbernic","Retroid Pocket","Miyoo Mini","Powkiddy","Ayn Odin","Ayaneo","ROG Ally","Lenovo Legion Go","MSI Claw","Analogue Pocket","Playdate","Meta Quest","Steam Machine","Otra"];
const GEN=["Adventure","Arcade","Card & Board Game","Fighting","Hack and slash/Beat 'em up","Indie","MOBA","Music","Pinball","Platform","Point-and-click","Puzzle","Quiz/Trivia","Racing","Real Time Strategy (RTS)","Role-playing (RPG)","Shooter","Simulator","Sport","Strategy","Tactical","Turn-based strategy (TBS)","Visual Novel"];
const fd=d=>d?d.split("-").reverse().join("/"):"";
let tab="home",lib={st:"playing",q:"",f:{pl:"",gen:"",fmt:"",sort:"name"}},cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
function stats(){
 const dm={};S.sessions.forEach(s=>dm[s.date]=(dm[s.date]||0)+s.min);
 let xp=0;Object.values(dm).forEach(m=>xp+=Math.min(m,XP.maxMinPerDay)/60*XP.perHour);
 xp=Math.round(xp+S.sessions.length*XP.session+S.games.filter(g=>g.status==="done").length*XP.completed);
 const lv=Math.floor(Math.sqrt(xp/50))+1,lo=50*(lv-1)**2,hi=50*lv**2;
 const days=Object.keys(dm).sort();let rec=0,run=0,prev=null;
 days.forEach(d=>{const t=new Date(d+"T12:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;rec=Math.max(rec,run)});
 let cur=0,c=new Date();if(!dm[ymd(c)])c.setDate(c.getDate()-1);
 while(dm[ymd(c)]){cur++;c.setDate(c.getDate()-1)}
 return{xp,lv,lo,hi,dm,cur,rec:Math.max(rec,cur)};
}
function range(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a;
 if(p==="day")a=today();else if(p==="week"){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));a=ymd(d)}
 else if(p==="month")a=ymd(new Date(y,m,1));else a=ymd(new Date(y,0,1));
 return S.sessions.filter(s=>s.date>=a&&s.date<=today())}
function missions(){const w=range("week"),mo=range("month");
 return[{n:"Diaria: registra 1 sesión hoy",v:range("day").length,t:1},
 {n:"Semanal: 3 días activos",v:new Set(w.map(s=>s.date)).size,t:3},
 {n:"Mensual: 10 horas jugadas",v:Math.round(mo.reduce((a,s)=>a+s.min,0)/6)/10,t:10}]}
const bar=(v,t)=>`<div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div>`;
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',lib:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 13.5h.01"/>',diary:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function nav(){const t=[["home","Inicio"],["lib","Biblioteca"],["+",""],["diary","Diario"],["prof","Perfil"]];
 $("#nav").innerHTML=t.map(([k,l])=>k==="+"?`<button class="plus" aria-label="Añadir" onclick="openPlus()">+</button>`:`<button class="${tab===k?"on":""}" onclick="go('${k}')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}</button>`).join("")}
function go(t){tab=t;R()}
function R(){nav();$("#main").innerHTML=({home:vHome,lib:vLib,diary:vDiary,prof:vProf})[tab]();if(tab==="lib")list()}
function vHome(){const s=stats(),pl=S.games.filter(g=>g.status==="playing"),up=S.games.filter(g=>g.status==="wish"&&g.released&&g.released>today()).sort((a,b)=>a.released.localeCompare(b.released));
 const mem=[];S.games.forEach(g=>comps(g).forEach(d=>{const n=new Date(),t=new Date(d+"T12:00"),a=new Date(n.getFullYear(),t.getMonth(),t.getDate(),12),df=Math.round((n-a)/864e5),y=n.getFullYear()-t.getFullYear();if(y>0&&Math.abs(df)<=3)mem.push({g,y,d,df})}));
 return`<h1>¡Hola, ${e(S.user.name)}!</h1><div class="mu">${APP_NAME} · ${SLOGAN}</div>
 <div class="hero"><div class="ring" style="--p:${Math.round((s.xp-s.lo)/(s.hi-s.lo)*100)}"><b>${s.lv}</b><small>NIVEL</small></div><div style="flex:1"><div class="mu">${s.xp} XP</div><b style="font-size:17px">Faltan ${s.hi-s.xp} XP</b><div><span class="chip">🔥 ${s.cur} días de racha</span><span class="chip">🏆 récord ${s.rec}</span></div></div></div>
 ${mem.length?`<h2>🎉 Recuerdos</h2>${mem.map(m=>`<div class="card row" style="cursor:pointer" onclick="openGame('${m.g.id}')">${th(m.g,44,58)}<div>Hace ${m.y} ${m.y===1?"año":"años"} te pasaste <b>${e(m.g.title)}</b><div class="mu">${fd(m.d)}${m.df===0?" · ¡es hoy!":""}</div></div></div>`).join("")}`:""}<h2>Jugando ahora</h2>${pl.length?pl.map(gc).join(""):`<div class="empty">Aún no tienes juegos en curso.<br><button class="pri" onclick="go('lib')">Ir a la biblioteca</button></div>`}
 <h2>Misiones activas</h2>${missions().map(m=>`<div class="card"><div class="row sp"><span>${m.n}</span><span class="mu">${Math.min(m.v,m.t)}/${m.t}${m.v>=m.t?" ✅":""}</span></div>${bar(m.v,m.t)}</div>`).join("")}
 <h2>Próximos lanzamientos</h2>${up.map(g=>`<div class="card row" style="cursor:pointer" onclick="openGame('${g.id}')">${th(g,44,58)}<b style="flex:1">${e(g.title)}</b><span class="mu">📅 ${fd(g.released)}<br>en ${Math.ceil((new Date(g.released+"T12:00")-new Date())/864e5)} d</span></div>`).join("")||`<div class="empty">Los juegos de Deseados con fecha de salida futura aparecerán aquí.</div>`}<div class="mu" style="margin-top:6px">Noticias de videojuegos: aún no disponible.</div>`}
function gc(g){return`<div class="card row sp" onclick="openGame('${g.id}')" style="cursor:pointer"><div class="row">${g.cover?`<img src="${e(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="width:56px;height:56px;object-fit:cover;border-radius:8px">`:`<div style="width:56px;height:56px;border-radius:8px;background:var(--s2);display:grid;place-items:center">🎮</div>`}<div><b>${e(g.title)}</b><div class="mu">${e(g.platform||"—")} · ${H(gm(g.id))}</div></div></div><span>›</span></div>`}
function vLib(){return`<h1>Biblioteca</h1>
 <div class="row" style="margin-top:8px"><input type="search" enterkeyhint="search" placeholder="Buscar en mi biblioteca" value="${e(lib.q)}" oninput="lib.q=this.value;list()"><button onclick="filt()" style="white-space:nowrap">⚙️ Filtros${Object.values(lib.f).filter((v,i)=>i<3&&v).length?" ("+Object.values(lib.f).filter((v,i)=>i<3&&v).length+")":""}</button></div>
 <div class="tabs">${Object.entries(ST).map(([k,v])=>`<button class="${lib.st===k?"on":""}" onclick="lib.st='${k}';R()">${v}</button>`).join("")}
 </div>${lib.st==="backlog"?`<button style="width:100%;margin-bottom:12px" onclick="randomBacklog()">🎲 Juego aleatorio del Backlog</button>`:""}<div id="list"></div>`}
function comps(g){if(!g.completions)g.completions=g.doneDate?[g.doneDate]:[];return g.completions}
function gg(g){const rt=g.rating?.score,n=comps(g).length;return`<div class="poster" onclick="openGame('${g.id}')"><div class="cv">${g.cover?`<img src="${e(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<div class="ph">🎮</div>`}</div><b>${e(g.title)}</b><span>⏱ ${H(gm(g.id))}${rt?" · ⭐ "+rt:""}${n>1?" · 🏁×"+n:""}</span></div>`}
function list(){const q=lib.q.toLowerCase(),F=lib.f;let a=S.games.filter(g=>g.status===lib.st&&g.title.toLowerCase().includes(q)&&(!F.pl||g.platform===F.pl)&&(!F.gen||(g.genre||"").split(",").map(z=>z.trim()).includes(F.gen))&&(!F.fmt||g.format===F.fmt));
 if(!a.length)return $("#list").innerHTML=`<div class="empty">No hay juegos aquí todavía.</div>`;
 if(lib.st!=="done"){const last=g=>S.sessions.filter(x=>x.gameId===g.id).reduce((m,x)=>x.date>m?x.date:m,""),so={name:(x,y)=>x.title.localeCompare(y.title),date:(x,y)=>(y.released||"").localeCompare(x.released||""),hours:(x,y)=>gm(y.id)-gm(x.id),rating:(x,y)=>(y.rating?.score||0)-(x.rating?.score||0)};
